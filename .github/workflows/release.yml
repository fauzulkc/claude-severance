name: Release

# v1.* tags build the PowerShell version (src/). v2.* and later build the Rust workspace
# (Cargo.toml, crates/, app/) for Windows, Linux and macOS. See docs/PLATFORMS-PLAN.md.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: An existing tag to build and publish again (for example v1.1.0)
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  prepare:
    name: Check the tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      prerelease: ${{ steps.v.outputs.prerelease }}
      kind: ${{ steps.v.outputs.kind }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}

      - name: Tag, version and CHANGELOG agree
        id: v
        run: |
          version="${TAG#v}"
          base="${version%%-*}"
          major="${base%%.*}"
          if [ "$major" -ge 2 ]; then
            kind=rust
            # the version in [workspace.package] of the root Cargo.toml
            source="Cargo.toml"
            found="$(sed -n '/^\[workspace\.package\]/,/^\[/ s/^version *= *"\([^"]*\)".*/\1/p' Cargo.toml 2>/dev/null | head -n 1 | tr -d '\r')"
            want="$version"
          else
            kind=powershell
            # .psm1 files are checked out with CRLF everywhere (.gitattributes), so drop the CR
            source="src/Severance.psm1"
            found="$(sed -n "s/^\$script:Version = '\([^']*\)'.*/\1/p" src/Severance.psm1 | tr -d '\r')"
            want="$base"
          fi
          if [ "$want" != "$found" ]; then
            echo "::error::Tag $TAG wants version $want but $source says '${found:-nothing}'."
            exit 1
          fi
          prerelease=false
          case "$version" in *-*) prerelease=true ;; esac
          # notes: the section for this exact version, else its base version, else Unreleased for a preview
          for section in "$version" "$base" Unreleased; do
            if [ "$section" = Unreleased ] && [ "$prerelease" != true ]; then break; fi
            awk -v v="## [$section]" 'index($0, v) == 1 { on = 1; next } /^## \[/ { on = 0 } on' CHANGELOG.md > notes.md
            if grep -q '[^[:space:]]' notes.md; then break; fi
          done
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "::error::CHANGELOG.md has no '## [$base]' section with notes."
            exit 1
          fi
          {
            echo "version=$version"
            echo "prerelease=$prerelease"
            echo "kind=$kind"
          } >> "$GITHUB_OUTPUT"
          echo "Building $kind $version"
          cat notes.md

      - uses: actions/upload-artifact@v7
        with:
          name: notes
          path: notes.md

  windows:
    name: Windows build (PowerShell)
    needs: prepare
    if: needs.prepare.outputs.kind == 'powershell'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}

      - name: Unit tests (Pester 5)
        shell: powershell
        run: |
          Install-Module Pester -MinimumVersion 5.5 -Force -SkipPublisherCheck -Scope CurrentUser
          Import-Module Pester -MinimumVersion 5.5
          $c = New-PesterConfiguration
          $c.Run.Path = 'tests'
          $c.Run.Exit = $true
          Invoke-Pester -Configuration $c

      - name: Render every setup screen
        shell: powershell
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'screenshots'
          powershell -NoProfile -ExecutionPolicy Bypass -File tools\capture-screens.ps1 -Out $out
          if (Select-String -Path (Join-Path $out 'capture.log') -Pattern 'saved=False') { Get-Content (Join-Path $out 'capture.log'); exit 1 }

      - name: Build the zip
        shell: powershell
        run: |
          $zip = powershell -NoProfile -ExecutionPolicy Bypass -File tools\build-release.ps1
          # a versionless copy, so releases/latest/download/ClaudeSeverance.zip always gives the newest
          Copy-Item $zip (Join-Path (Split-Path $zip) 'ClaudeSeverance.zip')
          Get-ChildItem dist -File | Format-Table Name, Length -AutoSize

      - uses: actions/upload-artifact@v7
        with:
          name: release-windows
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error

  rust:
    name: ${{ matrix.name }} build (Rust)
    needs: prepare
    if: needs.prepare.outputs.kind == 'rust'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Windows x64, os: windows-latest, targets: x86_64-pc-windows-msvc, asset: windows-x64, test: true }
          - { name: Windows Arm64, os: windows-latest, targets: aarch64-pc-windows-msvc, asset: windows-arm64, test: false }
          - { name: Linux x64, os: ubuntu-latest, targets: x86_64-unknown-linux-gnu, asset: linux-x86_64, test: true }
          - { name: Linux Arm64, os: ubuntu-24.04-arm, targets: aarch64-unknown-linux-gnu, asset: linux-aarch64, test: true }
          - { name: macOS, os: macos-latest, targets: 'aarch64-apple-darwin x86_64-apple-darwin', asset: macos-universal, test: true }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      TARGETS: ${{ matrix.targets }}
      ASSET: ${{ matrix.asset }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}

      - name: Toolchain and targets
        run: |
          rustup toolchain install
          read -r -a triples <<< "$TARGETS"
          for t in "${triples[@]}"; do rustup target add "$t"; done

      - name: Linux libraries for the window (WebKitGTK)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.asset }}

      - name: Tests
        if: matrix.test
        run: cargo test --workspace --locked

      - name: Build the command line and the manager window
        run: |
          read -r -a triples <<< "$TARGETS"
          for t in "${triples[@]}"; do cargo build --release --locked --package severance-cli --package severance-app --target "$t"; done

      # The manager window ships as a plain program next to severance for now; installers (per-user on
      # Windows, .app on macOS, AppImage and .deb on Linux) are phase 5 of docs/PLATFORMS-PLAN.md.

      - name: Package
        run: |
          set -euo pipefail
          name="ClaudeSeverance-$VERSION-$ASSET"
          stage="stage/$name"
          mkdir -p "$stage" dist
          read -r -a triples <<< "$TARGETS"
          set -- "${triples[@]}"
          for bin in severance severancew ClaudeSeverance; do
            case "$ASSET" in
              windows-*) cp "target/$1/release/$bin.exe" "$stage/" ;;
              macos-*)   lipo -create -output "$stage/$bin" "target/$1/release/$bin" "target/$2/release/$bin" ;;
              *)         cp "target/$1/release/$bin" "$stage/" ;;
            esac
          done
          cp LICENSE NOTICE README.md CHANGELOG.md "$stage/"
          cd stage
          case "$ASSET" in
            windows-*) file="$name.zip"; 7z a -tzip -bso0 "../dist/$file" "$name" ;;
            *)         file="$name.tar.gz"; tar -czf "../dist/$file" "$name" ;;
          esac
          cd ../dist
          if command -v sha256sum >/dev/null; then sha256sum "$file" > "$file.sha256"; else shasum -a 256 "$file" > "$file.sha256"; fi
          ls -l

      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.asset }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish
    needs: [prepare, windows, rust]
    # one of the build jobs is always skipped (by kind), so don't let the skip skip this job too
    if: ${{ !cancelled() && needs.prepare.result == 'success' && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}

      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - uses: actions/download-artifact@v8
        with:
          name: notes

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/*

      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          ls -l dist
          flags=()
          # a manual re-run of an older tag must not take "latest" from a newer release
          if [ "$PRERELEASE" = "true" ]; then flags+=(--prerelease); elif [ "$GITHUB_EVENT_NAME" = "push" ]; then flags+=(--latest); fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
            gh release edit "$TAG" --notes-file notes.md "${flags[@]}"
          else
            gh release create "$TAG" dist/* --title "Claude Severance $VERSION" --notes-file notes.md --verify-tag "${flags[@]}"
          fi
